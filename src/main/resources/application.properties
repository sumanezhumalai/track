spring.application.name=egssupport

# ── DataSource ──────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/egs_support
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── Servlet / Context path ────────────────────────────────────
# Aligns with React baseURL '/egssupport/api' and Tomcat deployment root
server.servlet.context-path=/egssupport
server.servlet.session.timeout=30m
